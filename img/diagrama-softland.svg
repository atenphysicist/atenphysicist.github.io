<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 340" role="img" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>Agente de automatización para ERP Softland</title>
<desc>Softland entrega notas de venta nuevas a un agente en Python que se ejecuta cada 10 segundos; el agente escribe el cliente en Excel e imprime la nota. Un backend de licencias queda como siguiente fase.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#7fa09b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g>
<rect x="40" y="110" width="160" height="56" rx="8" fill="#1a2928" stroke="#3b4f4d" stroke-width="1"/>
<text x="120" y="128" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#d6e4e1">ERP Softland</text>
<text x="120" y="148" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#8fa5a1">Notas de venta</text>
</g>
<g>
<rect x="240" y="110" width="200" height="56" rx="8" fill="#0f3d36" stroke="#2dd4bf" stroke-width="1"/>
<text x="340" y="128" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#ccfbf1">Agente en Python</text>
<text x="340" y="148" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5eead4">Revisa cada 10 segundos</text>
</g>
<g>
<rect x="500" y="60" width="140" height="56" rx="8" fill="#1a2928" stroke="#3b4f4d" stroke-width="1"/>
<text x="570" y="78" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#d6e4e1">Excel</text>
<text x="570" y="98" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#8fa5a1">Anota el cliente</text>
</g>
<g>
<rect x="500" y="160" width="140" height="56" rx="8" fill="#1a2928" stroke="#3b4f4d" stroke-width="1"/>
<text x="570" y="178" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#d6e4e1">Impresora</text>
<text x="570" y="198" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#8fa5a1">Imprime la nota</text>
</g>
<g>
<rect x="240" y="250" width="200" height="56" rx="8" fill="#211d38" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4 4"/>
<text x="340" y="268" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#ede9fe">Backend en proyecto</text>
<text x="340" y="288" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#c4b5fd">Licencia y monitoreo</text>
</g>
<line x1="200" y1="138" x2="238" y2="138" stroke="#7fa09b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M440 138 L470 138 L470 88 L498 88" fill="none" stroke="#7fa09b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M440 138 L470 138 L470 188 L498 188" fill="none" stroke="#7fa09b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="166" x2="340" y2="248" stroke="#7fa09b" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
</svg>
